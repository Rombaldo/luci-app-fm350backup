name: Тесты

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Библиотеки для теста чтения
        run: |
          python -m pip install --quiet --require-hashes --no-deps --only-binary :all: -r requirements-router.txt
      - name: Автотесты
        run: scripts/test.sh
      - name: Проверка личных данных в исходниках
        run: scripts/check-private.sh --before
      - name: Лёгкая сборка
        run: python scripts/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/

  install:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openwrt: ["23.05.6", "24.10.8", "25.12.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Установка на OpenWrt ${{ matrix.openwrt }}
        run: |
          (cd dist/release && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          docker run --rm --network host -v "$PWD:/repo:ro" "openwrt/rootfs:x86-64-${{ matrix.openwrt }}" \
            sh /repo/scripts/test-in-openwrt.sh http://127.0.0.1:8765 /repo/dist/release
