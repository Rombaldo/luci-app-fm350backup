name: Сборка релиза

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --quiet --require-hashes --no-deps --only-binary :all: -r requirements-router.txt
      - run: scripts/test.sh
      - name: Сборка с адресом этого репозитория
        run: python scripts/build-release.py --repo "$GITHUB_REPOSITORY"
      - name: Версия тега совпадает с VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      # Только черновик: его проверяют личные данные на своём компьютере и выпускает сам владелец
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --draft --title "$GITHUB_REF_NAME" --notes "Сборка из $GITHUB_SHA"
